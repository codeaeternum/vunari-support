<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Vunari</title>
  <style>
    :root { color-scheme:light dark; --forest:#0b3d32; --mint:#42d698; --paper:#fbfaf5; --ink:#17201d; --muted:#5d6965; --line:#d7dfdc; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--paper); color:var(--ink); }
    main { width:min(620px,100%); padding:32px; border:1px solid var(--line); border-radius:20px; }
    .eyebrow { color:#087253; font-size:.76rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:.4rem 0 .8rem; font-size:clamp(2rem,8vw,3.6rem); line-height:1.05; letter-spacing:-.04em; }
    p { margin:.75rem 0; }
    a { color:#087253; text-underline-offset:4px; }
    @media (prefers-color-scheme:dark) { :root { --paper:#101513; --ink:#f2f5f3; --muted:#aeb9b5; --line:#33403b; } a,.eyebrow { color:#62e2ae; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Vunari · 404</div>
    <h1>Esta carta no está en la mesa.</h1>
    <p>La página que buscas no existe o cambió de lugar. Vuelve a <a href="index.html">soporte y privacidad de Vunari</a>.</p>
    <p lang="en">The page you are looking for does not exist or has moved. Return to <a href="index.html">Vunari support and privacy</a>.</p>
  </main>
</body>
</html>
